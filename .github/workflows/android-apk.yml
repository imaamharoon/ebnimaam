name: Build Android APK
on:
  push:
    branches: [main, preview/mobile-header-refine]
    paths:
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
      - 'public/**'
      - 'app/**'
      - 'ebnimaam-logo.webp'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install web app dependencies
        run: npm install
      - name: Verify Next.js production build
        run: npm run build
      - name: Install Capacitor tooling, Android back navigation and icon generator
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/status-bar@7 @capacitor/app@7 @capacitor/assets sharp
      - name: Prepare branded app icon from the supplied Ebnimaam logo
        run: |
          mkdir -p assets
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp({
            create: { width: 1024, height: 1024, channels: 4, background: { r: 255, g: 255, b: 255, alpha: 0 } }
          })
            .composite([{ input: await sharp('ebnimaam-logo.webp').resize(760, 760, { fit: 'contain' }).png().toBuffer(), gravity: 'centre' }])
            .png()
            .toFile('assets/icon.png');
          NODE
      - name: Generate Android wrapper
        run: npx cap add android
      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android
      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK and create release checksum
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 1048576
          sha256sum "$APK" > "$APK.sha256"
          printf 'Ebnimaam Android App\\nBuild: %s\\nCommit: %s\\nPackage: com.ebnimaam.store\\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > android/app/build/outputs/apk/version.txt
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-${{ github.run_number }}
          name: Ebnimaam Android App ${{ github.run_number }}
          make_latest: true
          body: 'Install the APK on Android. The SHA-256 checksum and build information are included for verification. Android system Back navigates backward through the WebView page history while the app is open.'
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/version.txt
          fail_on_unmatched_files: true
