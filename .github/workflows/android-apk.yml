name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
      - 'public/**'
      - 'app/**'
      - 'ebnimaam-logo.webp'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install web app dependencies
        run: npm install
      - name: Install Capacitor tooling and icon generator
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets sharp
      - name: Prepare branded app icon from the supplied Ebnimaam logo
        run: |
          mkdir -p assets
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp({
            create: { width: 1024, height: 1024, channels: 4, background: { r: 255, g: 255, b: 255, alpha: 0 } }
          })
            .composite([{ input: await sharp('ebnimaam-logo.webp').resize(760, 760, { fit: 'contain' }).png().toBuffer(), gravity: 'centre' }])
            .png()
            .toFile('assets/icon.png');
          NODE
      - name: Generate Android wrapper
        run: npx cap add android
      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android
      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-${{ github.run_number }}
          name: Ebnimaam Android App ${{ github.run_number }}
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
