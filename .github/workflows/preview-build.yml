name: Preview build validation

on:
  push:
    branches: [fix/paystack-size-stock-guards-20261127, security-experience-upgrade-20261127, release/loyalty-wallet-ai-20261128, fix/email-delivery-resend-20261127]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nextjs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Verify browser security headers preserve the embedded account flow
        run: npm run security:check
      - name: Type-check
        run: npm run typecheck
      - name: Build Next.js production bundle
        run: npm run build
