name: Preview build validation

on:
  push:
    branches: [fix/paystack-size-stock-guards-20261127, security-experience-upgrade-20261127]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nextjs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Verify browser security headers preserve the embedded account flow
        run: npm run security:check
      - name: Type-check
        run: npm run typecheck
      - name: Build Next.js production bundle
        run: npm run build
