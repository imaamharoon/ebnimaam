<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment confirmation · ebnimaam</title><style>body{font-family:Arial,sans-serif;background:#f8f6f2;color:#222;max-width:560px;margin:12vh auto;padding:24px}article{background:white;padding:28px;border-radius:16px}a{color:#333}</style></head><body><article><h1>Payment confirmation</h1><p id="msg">Checking your payment securely…</p><p id="ref"></p><a href="/store.html">Return to shop</a></article><script>const q=new URLSearchParams(location.search);const ref=q.get('reference')||q.get('trxref');document.getElementById('ref').textContent=ref?'Reference: '+ref:'';if(!ref){document.getElementById('msg').textContent='No payment reference found. Please use order tracking or contact support.'}else fetch('/api/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:ref})}).then(async r=>{const d=await r.json();document.getElementById('msg').textContent=r.ok&&d.paid?(localStorage.removeItem('ebnimaam_cart'),'Payment verified. Your order has been paid. Thank you!'):'Payment not confirmed yet. Please check your order status using the reference and email.'}).catch(()=>document.getElementById('msg').textContent='Unable to verify at this time. Please track your order later.')</script></body></html>
